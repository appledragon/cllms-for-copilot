<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>CLLMs Icon Preview</title>
  <style>
    body { background: #1e1b4b; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: system-ui; color: white; gap: 40px; }
    h1 { font-size: 18px; opacity: 0.7; }
    .row { display: flex; gap: 40px; align-items: end; }
    .box { text-align: center; }
    .box span { display: block; margin-top: 12px; font-size: 13px; opacity: 0.6; }
    .light { background: #f8fafc; padding: 24px; border-radius: 16px; }
  </style>
</head>
<body>
  <h1>CLLMs for Copilot — Icon Preview</h1>
  <div class="row">
    <div class="box">
      <img src="icon.svg" width="128" height="128" alt="128px"/>
      <span>128 × 128</span>
    </div>
    <div class="box">
      <img src="icon.svg" width="64" height="64" alt="64px"/>
      <span>64 × 64</span>
    </div>
    <div class="box">
      <img src="icon.svg" width="48" height="48" alt="48px"/>
      <span>48 × 48</span>
    </div>
    <div class="box light">
      <img src="icon.svg" width="128" height="128" alt="light bg"/>
      <span style="color:#333">Light BG</span>
    </div>
  </div>
</body>
</html>
